name: CI

# One job per check and one per artifact: each shows on its own in a PR, a
# failure names exactly what broke, and they all run side by side.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- C++ core -------------------------------------------------------------

  cpp-linux:
    name: "C++: build and tests (Ubuntu 26.04, GCC)"
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - name: Install toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (Debug)
        run: cmake -S . -B build/debug -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/debug

      - name: Test
        run: ctest --test-dir build/debug --output-on-failure

  cpp-windows:
    name: "C++: build and tests (Windows, MSVC 2022)"
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build
        run: cmake --build build/windows-msvc --config Debug

      - name: Test
        run: ctest --test-dir build/windows-msvc -C Debug --output-on-failure

  cpp-format:
    name: "C++: clang-format"
    runs-on: ubuntu-24.04
    # The same clang-format as on the developer's Ubuntu 26.04 (21.x): another
    # version formats some lines differently.
    container: ubuntu:26.04
    steps:
      - name: Install clang-format
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang-format git ca-certificates

      - uses: actions/checkout@v4

      - name: Check the formatting (.clang-format; .clang-format-ignore lists the exceptions)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          clang-format --version
          git ls-files '*.cpp' '*.h' | xargs clang-format --dry-run --Werror

  # --- Kotlin app: checks ---------------------------------------------------

  desktop-tests-linux:
    name: "Kotlin: desktop UI tests (Linux)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-kotlin

      - name: Desktop UI tests (the C++ core through JNI)
        working-directory: kmp
        run: ./gradlew :shared:desktopTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-tests-linux
          path: |
            kmp/shared/build/screenshots/*.png
            kmp/shared/build/reports/tests/

  desktop-tests-windows:
    name: "Kotlin: desktop UI tests (Windows)"
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-kotlin

      - name: Desktop UI tests (the C++ core through JNI)
        working-directory: kmp
        run: ./gradlew.bat :shared:desktopTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-tests-windows
          path: |
            kmp/shared/build/screenshots/*.png
            kmp/shared/build/reports/tests/

  android-lint:
    name: "Kotlin: Android lint"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-kotlin
        with:
          android: "true"

      - name: Android lint (fails on errors)
        working-directory: kmp
        run: ./gradlew :androidApp:lintDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: kmp/androidApp/build/reports/lint-results-debug.*

  # --- Kotlin app: artifacts ------------------------------------------------

  android-apk:
    name: "Artifact: Android APK (debug)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-kotlin
        with:
          android: "true"

      - name: Build the APK
        working-directory: kmp
        run: ./gradlew :androidApp:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: kmp/androidApp/build/outputs/apk/debug/*.apk

  linux-deb:
    name: "Artifact: Linux DEB package"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-kotlin

      - name: Build the DEB
        working-directory: kmp
        run: ./gradlew :desktopApp:packageDeb

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: kmp/desktopApp/build/compose/binaries/main/deb/*.deb

  windows-msi:
    name: "Artifact: Windows MSI installer"
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-kotlin

      # WiX 3 (for the MSI) comes with the runner image.
      - name: Build the MSI
        working-directory: kmp
        run: ./gradlew.bat :desktopApp:packageMsi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: kmp/desktopApp/build/compose/binaries/main/msi/*.msi
