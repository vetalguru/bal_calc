name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: C++ core on Ubuntu 26.04 (GCC)
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - name: Install toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (Debug)
        run: cmake -S . -B build/debug -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/debug

      - name: Test
        run: ctest --test-dir build/debug --output-on-failure

  windows:
    name: C++ core on Windows (MSVC 2022)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build and test
        run: |
          cmake --build build/windows-msvc --config Debug
          ctest --test-dir build/windows-msvc -C Debug --output-on-failure

  kotlin:
    name: Kotlin app on Linux (Android APK, desktop UI test, DEB)
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 26.1.10909125
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build fakeroot

      - name: Install NDK, CMake and SDK platform
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "cmake;3.31.6" "platforms;android-37.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Desktop UI test (C++ core through JNI) and Android APK
        working-directory: kmp
        run: ./gradlew :shared:desktopTest :androidApp:assembleDebug :desktopApp:packageDeb :desktopApp:packageZip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balcalc-kotlin
          path: |
            kmp/androidApp/build/outputs/apk/debug/*.apk
            kmp/desktopApp/build/compose/binaries/main/deb/*.deb
            kmp/desktopApp/build/compose/binaries/main/zip/*.zip
            kmp/shared/build/screenshots/*.png
            kmp/shared/build/reports/tests/

  kotlin-windows:
    name: Kotlin app on Windows (desktop UI test, MSI)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # WiX 3 (for the MSI) comes with the runner image.
      - name: Desktop UI test (C++ core through JNI), MSI and ZIP
        working-directory: kmp
        run: ./gradlew.bat :shared:desktopTest :desktopApp:packageMsi :desktopApp:packageZip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balcalc-kotlin-windows
          path: |
            kmp/desktopApp/build/compose/binaries/main/msi/*.msi
            kmp/desktopApp/build/compose/binaries/main/zip/*.zip
            kmp/shared/build/screenshots/*.png
            kmp/shared/build/reports/tests/
